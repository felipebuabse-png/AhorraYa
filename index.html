</head>

<body>

<header>

    <div class="top">

        <div class="logo">
            Ahorra<span>Ya</span>
        </div>

        <div class="avatar">
            👤
        </div>

    </div>

    <div class="search">

        🔎

        <input
            id="searchInput"
            placeholder="Buscar producto..."
            oninput="searchProduct()"
        >

    </div>

</header>


<main class="container">

    <div class="greeting">

        <h2>Tu compra inteligente 🛒</h2>

        <p>
            Compará precios y descubrí dónde ahorrar.
        </p>

    </div>


    <div class="saving-card">

        <div class="saving-title">
            AHORRO POTENCIAL
        </div>

        <div class="saving-number" id="saving">
            $0
        </div>

        <div class="saving-info">
            💚 Comparando supermercados

        </div>

    </div>


    <div class="section-title">

        <h3>Productos rápidos</h3>

    </div>


    <div class="quick-products">

        <div class="quick" onclick="quickAdd('leche')">

            <div class="quick-icon">🥛</div>
            <div class="quick-name">Leche</div>

        </div>

        <div class="quick" onclick="quickAdd('yerba')">

            <div class="quick-icon">🧉</div>
            <div class="quick-name">Yerba</div>

        </div>

        <div class="quick" onclick="quickAdd('fideos')">

            <div class="quick-icon">🍝</div>
            <div class="quick-name">Fideos</div>

        </div>

        <div class="quick" onclick="quickAdd('arroz')">

            <div class="quick-icon">🍚</div>
            <div class="quick-name">Arroz</div>

        </div>

        <div class="quick" onclick="quickAdd('aceite')">

            <div class="quick-icon">🫒</div>
            <div class="quick-name">Aceite</div>

        </div>

    </div>


    <div class="section-title">

        <h3>Tu lista</h3>

        <span id="productCount">
            0 productos
        </span>

    </div>


    <div id="products"></div>


    <div class="add-box">

        <input
            id="productInput"
            placeholder="Agregar producto..."
            onkeydown="handleEnter(event)"
        >

        <button onclick="addFromInput()">
            Agregar
        </button>

    </div>


    <div id="total"></div>

</main>


<div class="bottom-nav">

    <div class="nav-inner">

        <div class="nav-item active">
            <div class="nav-icon">🏠</div>
            Inicio
        </div>

        <div class="nav-item">
            <div class="nav-icon">🛒</div>
            Lista
        </div>

        <div class="nav-item">
            <div class="nav-icon">💰</div>
            Ofertas
        </div>

        <div class="nav-item">
            <div class="nav-icon">👤</div>
            Perfil
        </div>

    </div>

</div>


<script>


// =====================================================
// BASE DE PRODUCTOS
// =====================================================

const database = {

    leche:{
        name:"Leche",
        icon:"🥛",
        prices:{
            "Supermercado A":1800,
            "Supermercado B":1650,
            "Supermercado C":1900
        }
    },

    yerba:{
        name:"Yerba",
        icon:"🧉",
        prices:{
            "Supermercado A":4800,
            "Supermercado B":4300,
            "Supermercado C":5100
        }
    },

    fideos:{
        name:"Fideos",
        icon:"🍝",
        prices:{
            "Supermercado A":1300,
            "Supermercado B":1150,
            "Supermercado C":1250
        }
    },

    arroz:{
        name:"Arroz",
        icon:"🍚",
        prices:{
            "Supermercado A":1700,
            "Supermercado B":1550,
            "Supermercado C":1800
        }
    },

    aceite:{
        name:"Aceite",
        icon:"🫒",
        prices:{
            "Supermercado A":3200,
            "Supermercado B":2900,
            "Supermercado C":3500
        }
    },

    shampoo:{
        name:"Shampoo",
        icon:"🧴",
        prices:{
            "Supermercado A":5200,
            "Supermercado B":4800,
            "Supermercado C":5500
        }
    },

    galletitas:{
        name:"Galletitas",
        icon:"🍪",
        prices:{
            "Supermercado A":1900,
            "Supermercado B":1750,
            "Supermercado C":2100
        }
    },

    coca:{
        name:"Coca-Cola",
        icon:"🥤",
        prices:{
            "Supermercado A":2500,
            "Supermercado B":2200,
            "Supermercado C":2700
        }
    }

};


// =====================================================
// LISTA
// =====================================================

let shoppingList = [];


// =====================================================
// FORMATO DE DINERO
// =====================================================

function money(value){

    return new Intl.NumberFormat(
        "es-AR",
        {
            style:"currency",
            currency:"ARS",
            maximumFractionDigits:0
        }
    ).format(value);

}


// =====================================================
// AGREGAR
// =====================================================

function addProduct(product){

    if(!database[product]){

        alert(
            "Producto no encontrado.\n\n" +
            "Probá con leche, yerba, fideos, arroz, aceite, shampoo, galletitas o coca."
        );

        return;

    }


    const existing =
        shoppingList.find(
            item => item.product === product
        );


    if(existing){

        existing.quantity++;

    }else{

        shoppingList.push({

            product:product,
            quantity:1

        });

    }


    render();

}


// =====================================================
// AGREGAR RÁPIDO
// =====================================================

function quickAdd(product){

    addProduct(product);

}


// =====================================================
// INPUT
// =====================================================

function addFromInput(){

    const input =
        document.getElementById("productInput");

    const product =
        input.value
        .trim()
        .toLowerCase();

    if(!product)return;

    addProduct(product);

    input.value="";

}


// =====================================================
// ENTER
// =====================================================

function handleEnter(event){

    if(event.key==="Enter"){

        addFromInput();

    }

}


// =====================================================
// CAMBIAR CANTIDAD
// =====================================================

function changeQuantity(index, amount){

    shoppingList[index].quantity += amount;


    if(shoppingList[index].quantity <= 0){

        shoppingList.splice(index,1);

    }


    render();

}


// =====================================================
// ELIMINAR
// =====================================================

function removeProduct(index){

    shoppingList.splice(index,1);

    render();

}


// =====================================================
// RENDER
// =====================================================

function render(){

    const container =
        document.getElementById("products");


    document.getElementById("productCount")
        .innerText =
        `${shoppingList.length} producto${shoppingList.length===1?"":"s"}`;


    if(shoppingList.length===0){

        container.innerHTML=`

            <div class="empty">

                <div style="font-size:45px">
                    🛒
                </div>

                <h3>
                    Todavía no agregaste productos
                </h3>

                <p>
                    Elegí uno de arriba o agregá uno manualmente.
                </p>

            </div>

        `;

        calculate();

        return;

    }


    let html="";


    shoppingList.forEach((item,index)=>{

        const data =
            database[item.product];


        const prices =
            Object.entries(data.prices);


        const cheapest =
            Math.min(
                ...prices.map(
                    ([name,price])=>price
                )
            );


        html+=`

            <div class="product">

                <div class="product-header">

                    <div class="product-name">

                        ${data.icon}
                        ${data.name}

                    </div>


                    <div class="quantity">

                        <button
                            onclick="changeQuantity(${index},-1)"
                        >
                            −
                        </button>

                        <strong>
                            ${item.quantity}
                        </strong>

                        <button
                            onclick="changeQuantity(${index},1)"
                        >
                            +
                        </button>

                    </div>

                </div>


                <div class="prices">

        `;


        prices.forEach(
            ([market,price])=>{

                const best =
                    price===cheapest;


                html+=`

                    <div class="price-row ${best?"best":""}">

                        <span class="market">

                            ${best?"🏆 ":""}
                            ${market}

                            ${
                                best
                                ?
                                `<span class="best-label">
                                    MÁS BARATO
                                </span>`
                                :
                                ""
                            }

                        </span>


                        <span class="price">

                            ${money(price * item.quantity)}

                        </span>

                    </div>

                `;

            }
        );


        html+=`

                </div>


                <button
                    class="remove"
                    onclick="removeProduct(${index})"
                >

                    🗑️ Eliminar

                </button>

            </div>

        `;

    });


    container.innerHTML=html;


    calculate();

}


// =====================================================
// CALCULAR TOTALES
// =====================================================

function calculate(){

    let bestTotal=0;

    let expensiveTotal=0;


    shoppingList.forEach(item=>{

        const prices =
            Object.values(
                database[item.product].prices
            );


        bestTotal +=
            Math.min(...prices)
            *
            item.quantity;


        expensiveTotal +=
            Math.max(...prices)
            *
            item.quantity;

    });


    const saving =
        expensiveTotal-bestTotal;


    document.getElementById("saving")
        .innerText =
        money(saving);


    if(shoppingList.length===0){

        document.getElementById("total")
            .innerHTML="";

        return;

    }


    document.getElementById("total")
        .innerHTML=`

            <div class="total-card">

                <div class="total-line">

                    <span>
                        Mejor precio posible
                    </span>

                    <strong>
                        ${money(bestTotal)}
                    </strong>

                </div>


                <div class="total-line">

                    <span>
                        Precio más alto
                    </span>

                    <strong>
                        ${money(expensiveTotal)}
                    </strong>

                </div>


                <hr style="border:none;border-top:1px solid #eee;margin:15px 0">


                <div class="total-line">

                    <span class="total-final">
                        Podrías ahorrar
                    </span>

                    <span
                        class="total-final"
                        style="color:#18a66a"
                    >
                        ${money(saving)}
                    </span>

                </div>

            </div>

        `;

}


// =====================================================
// BUSCADOR
// =====================================================

function searchProduct(){

    const value =
        document.getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();


    if(!value)return;


    const product =
        Object.keys(database)
        .find(
            key =>
            database[key].name
            .toLowerCase()
            .includes(value)
        );


    if(product){

        addProduct(product);

        document.getElementById("searchInput")
            .value="";

    }

}


// =====================================================
// INICIAR
// =====================================================

render();

</script>

</body>
</html>
```
